name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy script
        run: shellcheck deploy.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script
        run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash ~/Git-AzureServer-workflow/deploy.sh"

      - name: Check site is up
        run: curl --fail --silent http://${{ secrets.SERVER_HOST }}/ > /dev/null
